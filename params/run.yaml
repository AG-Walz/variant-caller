# params/run.yaml — the sarek parameters that are tuned, with the reason for each.
#
# Passed to the sarek clone with `-params-file`, so a run is this file, `nextflow.config`
# for resources, and the three per-cohort paths on scripts/run.sh's command line.
#
# It stays a file rather than becoming inline --flags for one reason: bash cannot carry a
# comment inside a backslash-continued command, so moving these onto the command line would
# delete the rationale below — including the four settings whose absence fails SILENTLY
# (igenomes_ignore, nucleotides_per_second, trim_fastq, germline_resource). nf-core's own
# `create-params-file` emits exactly this artefact, and all three peer pipelines document
# `-params-file` as the way to do it.

# --- what to run -------------------------------------------------------------
step: mapping              # start from FASTQ (not from BAM/CRAM)
tools: mutect2             # the somatic caller. PAIRING comes from the samplesheet
                           # status column, not from this flag
wes: true                  # targeted data, not WGS
igenomes_ignore: true      # LOAD-BEARING: without it the schema default --genome
                           # GATK.GRCh38 injects a 1000g panel-of-normals into Mutect2
                           # (changing which calls PASS), a .64.alt file into the BWA
                           # index, and a WGS intervals BED — each announced only as a
                           # log.warn

# --- the scatter -------------------------------------------------------------
# input:, outdir: and intervals: are NOT here. They are the three things that change per
# cohort, so they live on the command line in scripts/run.sh where you can see and edit
# them. Everything below is tuned and explained, and changing it changes the calls.
nucleotides_per_second: 1000   # 49,633,134 bp / 1000 / 600 -> 83 Mutect2 shards.
                               # At the schema default of 200000 the whole exome scores
                               # 248 "seconds", never crosses the 600 chunk threshold,
                               # and you get ONE shard: fully serial calling.

# --- reference bundle --------------------------------------------------------
fasta:                 references/Homo_sapiens_assembly38.fasta
fasta_fai:             references/Homo_sapiens_assembly38.fasta.fai
dict:                  references/Homo_sapiens_assembly38.dict
germline_resource:     references/af-only-gnomad.hg38.vcf.gz
germline_resource_tbi: references/af-only-gnomad.hg38.vcf.gz.tbi
# germline_resource does double duty: Mutect2's population allele frequencies AND the
# GetPileupSummaries/CalculateContamination source. Omit it and sarek does not error —
# it publishes the UNFILTERED VCF, FILTER all '.', which looks fine until someone runs
# `bcftools view -f PASS` and gets nothing. Supplying the _tbi we already download skips
# a measured 1m07s / 3 GB TABIX_GERMLINE_RESOURCE task.

# scripts/setup.py downloads the published BWA-MEM1 index, so point at it: that skips a
# measured 1h14m50s BWAMEM1_INDEX build. It changes BWAMEM1_MEM's input identity and so
# invalidates cached alignments — comment it out again if you must -resume an older run.
bwa: references/bwa

# --- what to skip ------------------------------------------------------------
skip_tools: baserecalibrator,fastqc,mosdepth,samtools,multiqc,bcftools,vcftools
# TWO different kinds of decision in one flag. `baserecalibrator` is a DOMAIN decision
# (BQSR off; it is also why no dbsnp/known_indels are needed) and changing it changes
# the calls. The other six are QC suppression so the pilot proves mechanics fast — the
# cost is that results/multiqc/ holds one 8 KB index.json and nothing else.

# --- tuned to this data ------------------------------------------------------
markduplicates_pixel_distance: 2500  # NovaSeq 6000 is a patterned flowcell; Picard's
                                     # default of 100 is for unpatterned optics, and
                                     # leaving it makes the duplicate rate simply wrong
trim_fastq: true                     # MANDATORY for the next line to do anything: FASTP
                                     # is gated on trim_fastq || split_fastq || umi_location,
                                     # so trim_nextseq ALONE is a silent no-op
trim_nextseq: true                   # 2-colour chemistry reads "no signal" as G, so
                                     # poly-G tails are real artefacts
save_reference: true                 # publish the aligner index to results/reference/
                                     # instead of discarding it with the work dir
